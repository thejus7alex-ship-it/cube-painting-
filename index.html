<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="PASTE_YOUR_ACTUAL_GOOGLE_CODE_HERE" />
    
    <title>Cube Painting - 3D Pixel Art Studio</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            color: #ff0077;
            margin: 10px 0 5px 0;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(255, 0, 119, 0.3);
        }

        .subtitle {
            color: #8a8a9e;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        /* Control Panel */
        .controls {
            background: #252538;
            max-width: 340px;
            margin: 0 auto 15px auto;
            padding: 12px;
            border-radius: 15px;
            border: 1px solid #3d3d5c;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .btn {
            background-color: #3d3d5c;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:active { transform: scale(0.95); }
        .clear-btn { background-color: #ff3366; }
        .save-btn { background-color: #00ffcc; color: #1a1a24; }

        /* Color Palette Selection */
        .palette {
            display: flex;
            justify-content: center;
            gap: 8px;
            max-width: 340px;
            margin: 0 auto 20px auto;
            background: #252538;
            padding: 10px;
            border-radius: 12px;
        }

        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-swatch.selected {
            border-color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        /* The Art Grid */
        .canvas-container {
            display: flex;
            justify-content: center;
            margin: 0 auto;
        }

        #pixelGrid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            grid-template-rows: repeat(16, 1fr);
            gap: 1px;
            width: 340px;
            height: 340px;
            background-color: #101018;
            border: 4px solid #ff0077;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .pixel {
            background-color: #2e2e3e;
            cursor: pointer;
            transition: background-color 0.05s;
        }
    </style>
</head>
<body>

    <h1>Cube Painting Studio</h1>
    <p class="subtitle">Pick a color below and start your cube painting canvas!</p>

    <div class="controls">
        <button class="btn clear-btn" onclick="clearCanvas()">🧹 CLEAR</button>
        <button class="btn save-btn" onclick="exportCanvas()">💾 EXPORT ART</button>
    </div>

    <div class="palette" id="palette">
        <div class="color-swatch selected" style="background-color: #ff0055;" onclick="selectColor('#ff0055', this)"></div>
        <div class="color-swatch" style="background-color: #00ffcc;" onclick="selectColor('#00ffcc', this)"></div>
        <div class="color-swatch" style="background-color: #0099ff;" onclick="selectColor('#0099ff', this)"></div>
        <div class="color-swatch" style="background-color: #ffcc00;" onclick="selectColor('#ffcc00', this)"></div>
        <div class="color-swatch" style="background-color: #b800ff;" onclick="selectColor('#b800ff', this)"></div>
        <div class="color-swatch" style="background-color: #ffffff;" onclick="selectColor('#ffffff', this)"></div>
        <div class="color-swatch" style="background-color: #2e2e3e;" onclick="selectColor('#2e2e3e', this)"></div> </div>

    <div class="canvas-container">
        <div id="pixelGrid"></div>
    </div>

    <script>
        const grid = document.getElementById('pixelGrid');
        let selectedColor = '#ff0055'; // Default starting color
        const gridSize = 16 * 16; // 16x16 pixel layout grid

        // Create the individual square canvas blocks
        for (let i = 0; i < gridSize; i++) {
            const pixel = document.createElement('div');
            pixel.classList.add('pixel');
            
            // Draw on touch or tap
            pixel.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                pixel.style.backgroundColor = selectedColor;
            });

            grid.appendChild(pixel);
        }

        // Palette selector color engine
        function selectColor(color, element) {
            selectedColor = color;
            
            // Remove selection ring decoration from old color swatch
            const swatches = document.querySelectorAll('.color-swatch');
            swatches.forEach(swatch => swatch.classList.remove('selected'));
            
            // Add ring decoration to newly touched color swatch
            element.classList.add('selected');
        }

        // Reset canvas blocks back to dark gray theme background
        function clearCanvas() {
            const pixels = document.querySelectorAll('.pixel');
            pixels.forEach(pixel => pixel.style.backgroundColor = '#2e2e3e');
        }

        // Render the HTML layout into a physical high-quality image file downloadable layout
        function exportCanvas() {
            const pixels = document.querySelectorAll('.pixel');
            const canvas = document.createElement('canvas');
            canvas.width = 160;
            canvas.height = 160;
            const ctx = canvas.getContext('2d');

            // Draw each individual pixel box to the target downloadable image map coordinate
            pixels.forEach((pixel, index) => {
                const x = (index % 16) * 10;
                const y = Math.floor(index / 16) * 10;
                ctx.fillStyle = pixel.style.backgroundColor || '#2e2e3e';
                ctx.fillRect(x, y, 10, 10);
            });

            // Trigger the auto device storage downloader sequence
            const imgUrl = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = imgUrl;
            link.download = 'pixel-art.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>
</html>
